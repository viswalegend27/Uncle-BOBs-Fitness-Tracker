{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Bob gym assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{% static 'trainer_bob/styles/muscle-detail.css' %}">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>

<body>
  <h1>Exercises for {{ name }}</h1>
  {% if exercises %}
  <div class="exercises-wrapper">
    {% for exercise in exercises %}
    <div class="exercises-content">
      <img class="exercise-imgs" src="{{ exercise.image_url }}" />
      <div>
        <h3 class="exe-names">{{exercise.name}}</h3>
        <p class="exe-description">{{ exercise.desc }}</p>
      </div>
    </div>
    {% endfor %}
    {% else %}
    <p>Sorry, no exercise available</p>
    {% endif %}
    <p>The above the optimal best exercises for you {{ muscle }}</p>
    <div class="go-back-btn">
      <p><a href="{% url 'exercises' %}">Go back</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>

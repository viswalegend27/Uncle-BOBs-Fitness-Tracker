{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Bob gym assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{% static 'trainer_bob/styles/calorie-calc.css' %}">
  <link rel="stylesheet" href="{% static 'trainer_bob/styles/navbar.css' %}">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>

<body>
  <!-- nav-bar -->
  <header>
    <img src="{% static 'trainer_bob/images/main-logo.png'%}" alt="logo-main" class="main-logo" />

    <div class="nav-container">
      <nav>
        <ul>
          <li><a href="{% url 'home' %}">Home</a></li>

          <li class="dropdown">
            <a href="#">FIT Tools</a>

            <ul class="dropdown-menu">
              <li><a href="{% url 'calorie-calc' %}">Calorie Calculator</a></li>
              <li><a href="{% url 'diet-planner' %}">Diet Planner</a></li>
            </ul>
          </li>

          <li><a href="{% url 'diet_blogs'%}">Diet-Blogs</a></li>
          <li><a href="#">About us</a></li>

          <li>
            <button class="user-log">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <path fill="none" d="M0 0h24v24H0z"></path>

                <path
                  fill="currentColor"
                  d="M12 12a5 5 0 1 0-5-5a5 5 0 0 0 5 5zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5z">
                </path>
              </svg>
            </button>
          </li>

          <li>
            <button class="ex-plan">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <path fill="none" d="M0 0h24v24H0z"></path>

                <path
                  fill="currentColor"
                  d="M9 2a2 2 0 0 0-2 2H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1a2 2 0 0 0-2-2H9zm0 2h6v2H9V4zm-1 6h8v2H8v-2zm0 4h8v2H8v-2z">
                </path>
              </svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- main container -->
  <div class="calculator">

    <!-- my left section -->
    <div class="left-section" id="l-sec">
      <div class="calorie-calculator">
        <h1 class="d-flex justify-content-center">Calorie calculator</h1>

        <div class="tabs">
          <div class="unit-tabs">
            <button type="button" class="tab-btn active" data-unit="metric">
              Metric
            </button>

            <button type="button" class="tab-btn" data-unit="imperial">
              Imperial
            </button>
          </div>
        </div>

        <form action="{% url 'calorie-calc' %}" method="post" class="form">
          {% csrf_token %}

          <!-- hidden input which is used to determine the units -->
          <input
            type="hidden"
            name="unit_system"
            id="unit_system_input"
            value="metric">

          <!-- my weight section -->
          <div class="form-group">
            <div class="user-weight-kgs user-weight" id="weight-system">
              <label for="weight-input" class="label">Weight</label>

              <input
                type="number"
                id="weight-input"
                name="weight"
                placeholder="Kg"
                class="user-input">
            </div>
          </div>

          <!-- my height input system -->
          <div id="imperial-height-group" class="imp-hg-grp">
            <div class="user-weight">
              <label class="label">Height</label>

              <div class="input-group height-label">
                <input
                  type="number"
                  name="height_ft"
                  placeholder="5 ft"
                  class="user-input">

                <input
                  type="number"
                  name="height_in"
                  placeholder="5 in"
                  class="user-input">
              </div>
            </div>
          </div>

          <div id="metric-height-group" class="height-user">
            <div class="user-weight">
              <label class="label">Height</label>

              <div class="input-group d-flex align-items-center">
                <input
                  type="number"
                  name="height_cm"
                  placeholder="165 cm"
                  class="user-input">
              </div>
            </div>
          </div>

          <div id="activity-level" class="form-group">
            <label class="label">Activity</label>

            <select name="activity" id="act-select" class="slect-exe">
              <option value="bmr" class="opt-cls">
                Basal metabolic rate (BMR)
              </option>

              <option value="sedentary" class="opt-cls">
                Sedentary
              </option>

              <option value="light-exercises" class="opt-cls">
                Light-Exercises(1-3 times/Week)
              </option>

              <option value="moderate-exercises" class="opt-cls">
                Moderate-Exercises(4-5 times/Week)
              </option>

              <option value="active-exercises" class="opt-cls">
                Active-Exercises(Daily exercises)
              </option>
            </select>
          </div>

          <div class="form-group">
            <label class="label">Age</label>

            <input
              type="text"
              name="age"
              placeholder="20"
              class="user-input">
          </div>

          <div class="form-group">
            <label class="label">Gender</label>

            <select name="gender" id="pet-select" class="slect-exe">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="d-flex justify-content-center">
            <button class="main-btn" id="calc-btn">
              <span>Calculate</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="right-section" id="r-sec">
      <div class="right-container empty-state" id="right-container">
        <div class="result"></div>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
  </script>

  <script src="{% static 'trainer_bob/scripts/caloriecalc.js' %}"></script>
</body>

</html>
